<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>羊猫的基金监控</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .card h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 12px;
    }
    .card p {
      font-size: 15px;
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102,126,234,0.4);
    }
    .btn-secondary {
      background: #f5f5f5;
      color: #333;
    }
    .btn-secondary:hover {
      background: #e8e8e8;
    }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #aaa;
    }
    .badge {
      display: inline-block;
      background: #fff3cd;
      color: #856404;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">📊 实时数据</div>
    <h1>羊猫的基金监控</h1>
    <p>纳斯达克 · 标普500 · 每日跟踪<br>点击下方按钮查看最新数据</p>

    <a class="btn btn-primary" href="https://www.workbuddy.cn/space/d/HP1q2v7MbgPDi1DF1woHSR" target="_blank">
      📈 打开纳指标普监控页
    </a>

    <a class="btn btn-secondary" href="https://v.douyin.com/xxxx" target="_blank">
      🐱 关注我的抖音
    </a>

    <div class="footer">

    </div>
  </div>
</body>
</html>
